name: Continuous Build & Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # LINUX BUILD JOB (.deb & .tar.gz)
  # ==========================================
  build-linux:
    name: Build & Package Briefly (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dpkg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest

      - name: Determine Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_TAG=true
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="1.0.0-${{ github.ref_name }}.${SHORT_SHA}"
            IS_TAG=false
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_TAG=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Building Briefly version: $VERSION"

      - name: Build Debian (.deb) Package
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh ${{ steps.vars.outputs.VERSION }}

      - name: Build Portable (.tar.gz) Package
        run: |
          chmod +x scripts/build_tarball.sh
          ./scripts/build_tarball.sh ${{ steps.vars.outputs.VERSION }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: briefly-linux-${{ steps.vars.outputs.VERSION }}
          path: |
            dist/*.deb
            dist/*.tar.gz
          retention-days: 14

      - name: Create or Update Official GitHub Release (Linux)
        if: steps.vars.outputs.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
          generate_release_notes: true

      - name: Update Continuous Pre-Release (Linux)
        if: steps.vars.outputs.IS_TAG == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Briefly Latest Build (${{ github.ref_name }})"
          body: |
            ### 🚀 Continuous Build (Automated)
            This is an automated build generated from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            **Available Downloads:**
            - **Debian / Ubuntu / Mint**: `.deb` package
            - **Universal Linux**: `.tar.gz` portable bundle
            - **Windows**: `.zip` portable package with `Briefly.exe`

            *Automated build by GitHub Actions.*
          prerelease: true
          files: |
            dist/*.deb
            dist/*.tar.gz

  # ==========================================
  # WINDOWS BUILD JOB (.zip with Briefly.exe)
  # ==========================================
  build-windows:
    name: Build & Package Briefly (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest

      - name: Determine Version
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_TAG=true
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="1.0.0-${{ github.ref_name }}.${SHORT_SHA}"
            IS_TAG=false
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_TAG=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Building Briefly Windows version: $VERSION"

      - name: Build Windows Executable
        run: |
          pyinstaller --clean briefly.spec

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Briefly\* -DestinationPath dist\briefly-${{ steps.vars.outputs.VERSION }}-windows-portable.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: briefly-windows-${{ steps.vars.outputs.VERSION }}
          path: dist/*.zip
          retention-days: 14

      - name: Create or Update Official GitHub Release (Windows)
        if: steps.vars.outputs.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

      - name: Update Continuous Pre-Release (Windows)
        if: steps.vars.outputs.IS_TAG == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          files: dist/*.zip
