name: Continuous Build & Release

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # LINUX BUILD JOB (.deb & .tar.gz)
  # ==========================================
  build-linux:
    name: Build & Package Briefly (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dpkg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest

      - name: Determine Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_TAG=true
          else
            CLEAN_REF=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr -cd 'a-zA-Z0-9.-')
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="1.0.0-${CLEAN_REF}.${SHORT_SHA}"
            IS_TAG=false
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_TAG=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Building Briefly version: $VERSION"

      - name: Build Debian (.deb) Package
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh ${{ steps.vars.outputs.VERSION }}

      - name: Build Portable (.tar.gz) Package
        run: |
          chmod +x scripts/build_tarball.sh
          ./scripts/build_tarball.sh ${{ steps.vars.outputs.VERSION }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.deb
            dist/*.tar.gz
          retention-days: 7

  # ==========================================
  # WINDOWS BUILD JOB (.zip with Briefly.exe)
  # ==========================================
  build-windows:
    name: Build & Package Briefly (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest

      - name: Determine Version
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_TAG=true
          else
            CLEAN_REF=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr -cd 'a-zA-Z0-9.-')
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="1.0.0-${CLEAN_REF}.${SHORT_SHA}"
            IS_TAG=false
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_TAG=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Building Briefly Windows version: $VERSION"

      - name: Build Windows Executable
        run: |
          pyinstaller --clean briefly.spec

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Briefly\* -DestinationPath dist\briefly-${{ steps.vars.outputs.VERSION }}-windows-portable.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*.zip
          retention-days: 7

  # ==========================================
  # UNIFIED RELEASE JOB (Linux + Windows)
  # ==========================================
  publish-release:
    name: Publish Release (Linux & Windows)
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets

      - name: Inspect Downloaded Assets
        run: |
          mkdir -p final-dist
          cp release-assets/* final-dist/
          ls -la final-dist/

      # Prepare standardized universal assets (powers /releases/latest/download/... permalinks)
      - name: Prepare Standardized Universal Assets
        run: |
          cd final-dist
          for f in *windows*.zip; do [ -f "$f" ] && cp "$f" briefly-windows-portable.zip; done
          for f in *.deb; do [ -f "$f" ] && cp "$f" briefly-linux.deb; done
          for f in *linux*.tar.gz; do [ -f "$f" ] && cp "$f" briefly-linux-portable.tar.gz; done
          echo "Assets prepared for upload:"
          ls -la

      # Official Tag Release (e.g. v1.1.0, v1.2.0)
      - name: Publish Official GitHub Release (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: final-dist/*
          generate_release_notes: true

      # Continuous Pre-Release: Clean up obsolete files from previous runs
      - name: Clean Up Old Assets from 'latest' Release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking and purging previous assets from 'latest' release..."
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release view latest --repo "${{ github.repository }}" --json assets -q '.assets[].name' | while read -r asset; do
              if [ -n "$asset" ]; then
                echo "Deleting obsolete asset: $asset"
                gh release delete-asset latest "$asset" -y --repo "${{ github.repository }}" || true
              fi
            done
          fi

      # For latest pre-release, keep only the universal files
      - name: Keep only universal filenames for Latest Pre-Release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          mkdir -p latest-dist
          cp final-dist/briefly-windows-portable.zip latest-dist/ 2>/dev/null || true
          cp final-dist/briefly-linux.deb latest-dist/ 2>/dev/null || true
          cp final-dist/briefly-linux-portable.tar.gz latest-dist/ 2>/dev/null || true
          ls -la latest-dist/

      - name: Publish Clean Latest Pre-Release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Briefly Latest Build (${{ github.ref_name }})"
          body: |
            ### 🚀 Continuous Build (Automated)
            This is an automated build generated from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            **Downloads:**
            - **Windows (10/11)**: `briefly-windows-portable.zip` (Extract & run `Briefly.exe`)
            - **Debian / Ubuntu / Mint**: `briefly-linux.deb`
            - **Universal Linux**: `briefly-linux-portable.tar.gz`

            *This pre-release automatically cleans old builds on every update to keep only the latest files.*
          prerelease: true
          files: latest-dist/*
